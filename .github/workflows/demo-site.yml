name: Demo site (GitHub Pages)

on:
  push:
    branches: [main, claude/hopeful-carson-gzlb3o]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site lives at https://<owner>.github.io/<repo>/, so the repo name is the base path.
      - run: scripts/build-demo.sh
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
